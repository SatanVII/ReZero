name: Refresh weather (scheduled rebuild)

# 构建期取实况的代价：天气随构建固化。此工作流定时触发 Vercel Deploy Hook
# 重新构建站点，使右上角天气保持新鲜（Vercel 面板 Settings → Git → Deploy Hook 创建）。
on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点（UTC）
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo 'DEPLOY_HOOK_URL secret 未配置，跳过'; exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
