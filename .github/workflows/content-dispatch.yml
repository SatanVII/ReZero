name: Content dispatch (bump submodule)

# 收到 blog-content 仓库的 content-updated 事件后，
# 立即把 content 子模块推进到其最新提交并推送；
# push 触发 Vercel 重建（git 集成），无需 Deploy Hook。
on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch: {}   # 保留手动触发便于调试

permissions:
  contents: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodule to latest
        run: git submodule update --remote content

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain -- content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "chore: bump content submodule"
            git push
            echo "content updated -> vercel rebuild triggered by push"
          else
            echo "content unchanged, nothing to do"
          fi
